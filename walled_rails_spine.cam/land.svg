<!-- Walled rail plate. Units mm, y down. Designed for a 10 mm tool.
  path#land   : fill-rule evenodd; filled region = the floor to finish (rail tops, pad, boss), all at one height (Z0).
  path#raised : fill-rule evenodd; regions standing data-height="8" mm ABOVE the land. Any land edge it touches is a closed edge (wall).
  Everywhere else is void below the land: land edges facing it are open.
  Shared land/raised edges coincide exactly, and both boundaries carry a vertex wherever a wall starts or stops,
  so every land edge is wholly open or wholly walled. Rail widths: 3, 6, 8 mm; slot floors 12, 10.5, 8, 3 mm. -->
